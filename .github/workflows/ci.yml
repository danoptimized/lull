name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  flutter:
    name: Flutter (analyze, test, web build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze --fatal-infos

      - name: Test
        run: flutter test

      - name: Build web
        run: flutter build web --release

  apple-builds:
    name: Apple smoke builds (iOS, macOS)
    runs-on: macos-15
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    # Smoke builds only, pre-signing — failures are informative, not blocking.
    continue-on-error: true
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Build iOS (no codesign)
        run: flutter build ios --no-codesign --release

      - name: Build macOS
        run: flutter build macos --release

  supabase:
    name: Supabase (db tests)
    runs-on: ubuntu-latest
    # Local stack in CI is best-effort until M2.
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      - uses: supabase/setup-cli@v1

      - name: Start local database
        run: supabase db start

      - name: Run database tests
        run: supabase test db
