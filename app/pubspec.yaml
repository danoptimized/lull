name: lull
description: "Lull — a calm productivity app that rewards focused work."
publish_to: 'none'

version: 0.1.0+1

environment:
  sdk: ^3.12.1

dependencies:
  app_links: ^7.1.2
  audio_session: ^0.2.3
  cupertino_icons: ^1.0.8
  drift: ^2.20.0
  drift_flutter: ^0.2.0
  firebase_core: ^3.6.0
  firebase_messaging: ^15.1.3
  flutter:
    sdk: flutter
  flutter_animate: ^4.5.2
  flutter_riverpod: ^3.3.2
  flutter_svg: ^2.3.0
  flutter_timezone: ^5.1.0
  go_router: ^17.3.0
  intl: ^0.20.2
  just_audio: ^0.10.5
  shared_preferences: ^2.5.5
  supabase_flutter: ^2.14.2

dev_dependencies:
  build_runner: ^2.15.0
  drift_dev: ^2.20.0
  flutter_lints: ^6.0.0
  flutter_test:
    sdk: flutter
  mocktail: ^1.0.5

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/audio/

  fonts:
    - family: Manrope
      fonts:
        - asset: assets/fonts/Manrope-300.ttf
          weight: 300
        - asset: assets/fonts/Manrope-400.ttf
          weight: 400
        - asset: assets/fonts/Manrope-500.ttf
          weight: 500
        - asset: assets/fonts/Manrope-600.ttf
          weight: 600
        - asset: assets/fonts/Manrope-700.ttf
          weight: 700
        - asset: assets/fonts/Manrope-800.ttf
          weight: 800
